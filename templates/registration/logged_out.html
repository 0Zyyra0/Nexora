{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logged out &mdash; {{ profile.name|default:"Portfolio" }}</title>
  <link rel="stylesheet" href="{% static 'portfolio/accounts/nb.css' %}">
</head>
<body class="nb">
  <div class="nb-wrap">
    <div class="nb-box" style="text-align:center;">
      <span class="nb-tag">{{ site_settings.logged_out_tag }}</span>
      <h1>{{ site_settings.logged_out_title }}</h1>
      <p class="nb-sub">{{ site_settings.logged_out_subtitle }}</p>
      <a class="nb-btn" style="display:block;text-decoration:none;text-align:center;" href="{% url 'login' %}">Log back in &rarr;</a>
      <div class="nb-links">
        <a href="{% url 'portfolio:home' %}">Back to site</a>
        <span></span>
      </div>
    </div>
  </div>
</body>
</html>
