<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Neobrutalist</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#7dd3fc;background-image:radial-gradient(#00000012 1.5px,transparent 1.5px);background-size:22px 22px;color:#111;padding:24px}
.card{background:#fff;border:4px solid #111;border-radius:16px;box-shadow:10px 10px 0 #111;padding:44px 40px;max-width:460px;text-align:center;transform:rotate(-1deg)}
.badge{display:inline-block;background:#fde047;border:3px solid #111;border-radius:9px;font-weight:900;padding:6px 14px;box-shadow:4px 4px 0 #111;margin-bottom:20px;transform:rotate(2deg)}
h1{font-size:4.2rem;font-weight:900;letter-spacing:-.05em;line-height:1;margin-bottom:8px}
h2{font-size:1.05rem;font-weight:800;margin-bottom:10px}
p{font-weight:600;color:#444;font-size:.9rem;margin-bottom:26px}
a{display:inline-block;background:#4ade80;border:3px solid #111;border-radius:10px;color:#111;font-weight:900;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em;padding:12px 22px;text-decoration:none;box-shadow:5px 5px 0 #111;transition:all .12s}
a:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 #111}
</style>
</head>
<body>
<div class="card">
  <span class="badge">OOPS.</span>
  <h1>404</h1>
  <h2>This page ghosted you.</h2>
  <p>We looked everywhere. Behind the couch. In the junk drawer. It's gone.</p>
  <a href="{% url 'portfolio:home' %}">Take me home →</a>
</div>
</body>
</html>
